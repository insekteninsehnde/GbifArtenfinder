<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<title>Aufbau des TK25-Rasters: MTB, Quadrant, Minutenfeld</title>
<rect width="900" height="360" fill="#f8fafc"/>
<text x="30" y="28" font-weight="bold" font-size="15">Ein MTB (Blatt): 10′ breit × 6′ hoch → 4 Quadranten → je 15 Minutenfelder</text>
<g transform="translate(40,50)">
<rect width="500" height="270" fill="#fff" stroke="#1e3a8a" stroke-width="2"/>
<g stroke="#64748b" stroke-width=".6"><path d="M50 0V270M100 0V270M150 0V270M200 0V270M300 0V270M350 0V270M400 0V270M450 0V270"/><path d="M0 45H500M0 90H500M0 180H500M0 225H500"/></g>
<path d="M250 0V270M0 135H500" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="6 4"/>
<g font-size="26" fill="#0f766e" fill-opacity=".35" font-weight="bold" text-anchor="middle"><text x="125" y="80">1</text><text x="375" y="80">2</text><text x="125" y="215">3</text><text x="375" y="215">4</text></g>
<g font-size="10" fill="#475569"><text x="4" y="14">1</text><text x="54" y="14">2</text><text x="104" y="14">3</text><text x="154" y="14">4</text><text x="204" y="14">5</text><text x="4" y="59">6</text><text x="204" y="104">15</text></g>
<text x="2" y="-6" font-size="11" fill="#1e3a8a">Nordwest-Ecke des Blatts</text></g>
<g transform="translate(580,70)"><text font-weight="bold">Legende</text>
<line x1="0" y1="24" x2="40" y2="24" stroke="#1e3a8a" stroke-width="2"/><text x="50" y="28">MTB 6′ × 10′ (4-stellig: Zeile+Spalte)</text>
<line x1="0" y1="52" x2="40" y2="52" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="6 4"/><text x="50" y="56">Quadrant 3′ × 5′ (1 NW, 2 NO, 3 SW, 4 SO)</text>
<line x1="0" y1="80" x2="40" y2="80" stroke="#64748b" stroke-width=".6"/><text x="50" y="84">Minutenfeld 1′ × 1′ (1–15, 5 Sp. × 3 Z.)</text>
<text y="130" font-size="12" fill="#475569">Ursprung: 55°54′ N / 5°50′ E,</text><text y="148" font-size="12" fill="#475569">Zeile von Nord, Spalte von West.</text>
<text y="176" font-size="12" fill="#475569">Beispiel: 3725/2 · MF 7</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
