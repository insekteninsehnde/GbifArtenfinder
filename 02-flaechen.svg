<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<title>Ablauf: Flächen zeichnen, speichern, laden, Verwaltungsgrenze</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker></defs>
<rect width="900" height="300" fill="#f8fafc"/>
<g fill="#fff" stroke="#10b981" stroke-width="1.5">
<rect x="20" y="30" width="170" height="70" rx="8"/><rect x="250" y="30" width="170" height="70" rx="8"/><rect x="480" y="30" width="170" height="70" rx="8"/><rect x="710" y="30" width="170" height="70" rx="8"/></g>
<g text-anchor="middle"><text x="105" y="60" font-weight="bold">⬠ Fläche zeichnen</text><text x="105" y="80" font-size="11">Klick setzt Ecken</text>
<text x="335" y="60" font-weight="bold">✓ Schließen &amp; suchen</text><text x="335" y="80" font-size="11">Klick auf Startpunkt</text>
<text x="565" y="60" font-weight="bold">💾 Fläche speichern</text><text x="565" y="80" font-size="11">Name.geojson.json</text>
<text x="795" y="60" font-weight="bold">📂 Fläche laden</text><text x="795" y="80" font-size="11">oder Datei auf Karte ziehen</text></g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="190" y1="65" x2="248" y2="65"/><line x1="420" y1="65" x2="478" y2="65"/><line x1="650" y1="65" x2="708" y2="65"/></g>
<rect x="20" y="150" width="400" height="120" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="34" y="176" font-weight="bold">Verwaltungsgrenze (Nominatim/OSM)</text>
<text x="34" y="198" font-size="12">1) Ort eingeben, ☐ Verwaltungsgrenze anzeigen</text>
<text x="34" y="216" font-size="12">2a) „Als gezeichnete Fläche“ → ~60 Ecken, bearbeitbar</text>
<text x="34" y="234" font-size="12">2b) „Als Suchfläche (exakte Grenze)“ → Filter auf volle Grenze</text>
<text x="34" y="254" font-size="11" fill="#64748b">Bearbeiten einer Ecke hebt den exakten Filter auf.</text>
<rect x="450" y="150" width="430" height="120" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/>
<text x="464" y="176" font-weight="bold">Dateiformat (GeoJSON, RFC 7946)</text>
<text x="464" y="198" font-family="monospace" font-size="11">{"type":"FeatureCollection","features":[{</text>
<text x="464" y="214" font-family="monospace" font-size="11"> "type":"Feature","properties":{"name":…},</text>
<text x="464" y="230" font-family="monospace" font-size="11"> "geometry":{"type":"Polygon",</text>
<text x="464" y="246" font-family="monospace" font-size="11">  "coordinates":[[[lon,lat],…]]}}]}</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
